openapi: 3.0.3
info:
  title: NOURA API
  version: 0.1.0
  description: |
    NOURA (working name) mobile API. This document is the contract authority for the API and the
    generated Dart client (blueprint §3, §11).

    Conventions:
    - Base path `/v1`; JSON with snake_case fields; UUID identifiers; ISO-8601 timestamps; metric units.
    - Bearer authentication with a Supabase access token, except health endpoints and the
      provider webhook (which uses its own authorization header).
    - Success envelope: `{"data": {...}, "meta": {"request_id": "..."}}`.
    - Error envelope: `{"error": {"code", "message", "field_errors", "retryable"}, "meta": {...}}`.
    - Missing and non-owned resources both return 404.
    - Mutations require an `Idempotency-Key` header; edits require `expected_revision` and return
      409 `REVISION_CONFLICT` when stale.
    - Mutation request bodies reject unrecognized fields (`additionalProperties: false`).

    Every operation carries `x-noura-milestone` (the milestone that implements it) and
    `x-noura-status` (`implemented` or `planned`). Planned operations are contract drafts only: the
    API does not register them, and they may be refined (additively where possible) by their milestone.
  license:
    name: Proprietary
    url: https://example.invalid/license
servers:
  - url: http://localhost:8080
    description: Local development API
security:
  - bearerAuth: []
tags:
  - name: system
    description: Health and readiness probes.
  - name: profile
    description: Profile, preferences, onboarding and targets.
  - name: home
    description: Home summary.
  - name: media
    description: Private media uploads and downloads.
  - name: meals
    description: Meal scans, analysis and diary.
  - name: catalog
    description: Curated foods and recipes.
  - name: diet
    description: Diet plans and next-meal guidance.
  - name: insights
    description: Seven-day patterns.
  - name: workouts
    description: Workout plans and logs.
  - name: progress
    description: Weight, consistency and progress photos.
  - name: coach
    description: Coach chat and proposals.
  - name: jobs
    description: Background job status.
  - name: billing
    description: Entitlements, usage and billing provider events.
  - name: account
    description: Export and account deletion.

paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [system]
      summary: Liveness probe. Does not touch dependencies.
      security: []
      x-noura-milestone: M1
      x-noura-status: implemented
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /health/ready:
    get:
      operationId: getReadiness
      tags: [system]
      summary: Readiness probe. Checks database connectivity, server roles and queue schema.
      security: []
      x-noura-milestone: M1
      x-noura-status: implemented
      responses:
        '200':
          description: Ready to serve traffic.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: A dependency is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /v1/me:
    get:
      operationId: getMe
      tags: [profile]
      summary: Current user's profile, preferences, eligibility, revision and onboarding status.
      description: Creates an empty profile row on first call for the verified token subject.
      x-noura-milestone: M1
      x-noura-status: implemented
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: patchMe
      tags: [profile]
      summary: Save a partial profile / goal / screening / onboarding step.
      description: |
        Merges the supplied fields into the profile and bumps the profile revision by one.
        `expected_revision` must equal the current revision (409 otherwise). The server validates every
        field, recomputes eligibility when age or screening change, and, once onboarding is completed,
        refreshes the target snapshot when a target-relevant field changed. `onboarding_step` may only
        be set while onboarding is not completed. Replays of the same `Idempotency-Key` return the
        original response.
      x-noura-milestone: M2
      x-noura-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfilePatch' }
      responses:
        '200':
          description: Updated profile with incremented revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/me/preferences:
    put:
      operationId: putPreferences
      summary: Replace diet preferences.
      description: |
        Whole-object replacement. `expected_revision` is the preferences revision from `GET /v1/me`
        (`0` when no preferences exist yet). The first save creates revision 1.
      tags: [profile]
      x-noura-milestone: M2
      x-noura-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferencesInput' }
      responses:
        '200':
          description: Saved preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreferencesResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/me/training-preferences:
    put:
      operationId: putTrainingPreferences
      summary: Replace training preferences.
      description: |
        Whole-object replacement. `expected_revision` is the training-preferences revision from
        `GET /v1/me` (`0` when none exist yet). The first save creates revision 1.
      tags: [profile]
      x-noura-milestone: M2
      x-noura-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrainingPreferencesInput' }
      responses:
        '200':
          description: Saved training preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingPreferencesResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/me/notification-preferences:
    get:
      operationId: getNotificationPreferences
      summary: Local-reminder consent and preferences.
      description: |
        Backed by `app.user_preferences.reminder_settings` (an M1-provisioned jsonb column, unused
        until this milestone). Reminders are local device notifications only after explicit opt-in
        (blueprint §18: "No push infrastructure needed for V1") — there is no server-held push token.
      tags: [profile]
      x-noura-milestone: M10
      x-noura-status: implemented
      responses:
        '200':
          description: Current notification preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferencesResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    put:
      operationId: putNotificationPreferences
      summary: Replace local-reminder consent and preferences.
      description: |
        Whole-object replacement, same revision contract as the other `/v1/me/*` preference
        resources. Setting `consent_granted_at` happens only when the client sends a non-null value
        (an explicit opt-in action), never implicitly.
      tags: [profile]
      x-noura-milestone: M10
      x-noura-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferencesInput' }
      responses:
        '200':
          description: Saved notification preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferencesResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/onboarding/complete:
    post:
      operationId: completeOnboarding
      tags: [profile]
      summary: Transactionally completes onboarding, creates the target snapshot and the plan request.
      description: |
        In one transaction: verifies the profile revision and that every onboarding input is present,
        records consents, determines eligibility, completes onboarding, and (only for eligible users
        when an allowed target policy exists) writes a target snapshot and one durable generation
        request. The request is relayed to the job queue by the worker, so a queue or generation
        failure never loses profile data. Replays of the same `Idempotency-Key` return the original
        response; a second completion is rejected.
      x-noura-milestone: M2
      x-noura-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingCompleteRequest' }
      responses:
        '200':
          description: Profile and created job ids.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingCompleteResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/targets:
    get:
      operationId: getTargets
      summary: Current nutrition target snapshot.
      tags: [profile]
      x-noura-milestone: M2
      x-noura-status: implemented
      responses:
        '200':
          description: Current target snapshot and calculation method.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetSnapshotResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/home:
    get:
      operationId: getHome
      summary: Home summary for a date.
      tags: [home]
      x-noura-milestone: M6
      x-noura-status: implemented
      parameters:
        - $ref: '#/components/parameters/DateQuery'
      responses:
        '200':
          description: Home summary for the date.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/media/upload-slots:
    post:
      operationId: createUploadSlot
      summary: Reserve an owner-scoped signed upload slot.
      tags: [media]
      x-noura-milestone: M4
      x-noura-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadSlotRequest' }
      responses:
        '201':
          description: Owner-scoped signed upload slot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSlotResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
  /v1/media/{id}/complete:
    post:
      operationId: completeUpload
      summary: Confirm an upload and verify the stored bytes.
      tags: [media]
      x-noura-milestone: M4
      x-noura-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Verified media status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAssetResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/media/{id}/download:
    get:
      operationId: getMediaDownload
      summary: Short-lived signed download link for owned media.
      tags: [media]
      x-noura-milestone: M4
      x-noura-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Short-lived signed download link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaDownloadResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/media/{id}:
    delete:
      operationId: deleteMedia
      summary: Delete owned media.
      tags: [media]
      x-noura-milestone: M4
      x-noura-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Deletion status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAssetResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/meal-scans:
    post:
      operationId: createMealScan
      summary: Start recognition for an uploaded meal image.
      tags: [meals]
      x-noura-milestone: M4
      x-noura-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMealScanRequest' }
      responses:
        '202':
          description: Scan job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MealScanAcceptedResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
  /v1/meal-scans/{id}:
    get:
      operationId: getMealScan
      summary: Meal scan state and recognition candidates.
      tags: [meals]
      x-noura-milestone: M4
      x-noura-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Scan state and recognition candidates.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MealScanResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/meal-scans/{id}/confirmed-items:
    put:
      operationId: confirmMealScanItems
      summary: Confirm foods and portions; returns calculated analysis.
      tags: [meals]
      x-noura-milestone: M4
      x-noura-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmItemsRequest' }
      responses:
        '200':
          description: Calculated analysis. Not a diary log.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MealAnalysisResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/meal-scans/{id}/plate-fixes:
    post:
      operationId: createPlateFixes
      summary: Propose up to three plate improvements.
      tags: [meals]
      x-noura-milestone: M5
      x-noura-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevisionRequest' }
      responses:
        '200':
          description: Up to three validated fixes with projected scenarios.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlateFixesResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }

  /v1/foods:
    get:
      operationId: searchFoods
      summary: Search the food catalog.
      tags: [catalog]
      x-noura-milestone: M3
      x-noura-status: planned
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated catalog foods.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoodListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/recipes/{id}:
    get:
      operationId: getRecipe
      summary: Curated recipe with instructions.
      tags: [catalog]
      x-noura-milestone: M3
      x-noura-status: planned
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Curated recipe with instructions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipeResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/meal-logs:
    post:
      operationId: createMealLog
      summary: Log a confirmed meal.
      tags: [meals]
      x-noura-milestone: M4
      x-noura-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMealLogRequest' }
      responses:
        '201':
          description: Logged meal snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MealLogResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      operationId: listMealLogs
      summary: Meal diary for a date.
      tags: [meals]
      x-noura-milestone: M4
      x-noura-status: implemented
      parameters:
        - $ref: '#/components/parameters/DateQueryRequired'
      responses:
        '200':
          description: Diary for the date with coverage and totals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MealDiaryResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/meal-logs/{id}:
    patch:
      operationId: patchMealLog
      summary: Edit a meal log.
      tags: [meals]
      x-noura-milestone: M4
      x-noura-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchMealLogRequest' }
      responses:
        '200':
          description: Changed log.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MealLogResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteMealLog
      summary: Delete a meal log.
      tags: [meals]
      x-noura-milestone: M4
      x-noura-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedRevisionQuery'
      responses:
        '200':
          description: Deleted; derived summaries invalidated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RevisionConflict' }

  /v1/diet-plans/generate:
    post:
      operationId: generateDietPlan
      summary: Request seven-day diet plan generation.
      tags: [diet]
      x-noura-milestone: M3
      x-noura-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GeneratePlanRequest' }
      responses:
        '202':
          description: Generation job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAcceptedResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
  /v1/diet-plans/current:
    get:
      operationId: getCurrentDietPlan
      summary: Active weekly diet plan.
      tags: [diet]
      x-noura-milestone: M3
      x-noura-status: implemented
      parameters:
        - $ref: '#/components/parameters/DateQuery'
      responses:
        '200':
          description: Active weekly plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DietPlanResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/diet-plan-meals/{id}/swap-options:
    post:
      operationId: getSwapOptions
      summary: Swap candidates for a plan meal with a daily preview.
      tags: [diet]
      x-noura-milestone: M3
      x-noura-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevisionRequest' }
      responses:
        '200':
          description: Swap candidates and recalculated daily preview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SwapOptionsResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '422': { $ref: '#/components/responses/ConstraintConflict' }
  /v1/diet-plan-meals/{id}:
    put:
      operationId: replacePlanMeal
      summary: Replace one plan meal with a confirmed candidate.
      tags: [diet]
      x-noura-milestone: M3
      x-noura-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplacePlanMealRequest' }
      responses:
        '200':
          description: Updated plan slot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanMealResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/recommendations/next-meal:
    get:
      operationId: getNextMeal
      summary: The next-meal recommendation, with reasons and alternatives.
      description: |
        Determines whichever of today's slots (breakfast/lunch/dinner/snack) is next by time of day
        and not yet logged, or uses `slot` as an explicit override (e.g. "what should I have for
        dinner"). Grounded entirely in the caller's active diet plan, today's meal log and the
        eligible catalog (blueprint §9, §16 M6); never an AI-invented suggestion. `limited_context`
        is true whenever today's logged intake is empty or has incomplete nutrition coverage, so a
        gap-based reason is never implied from data that cannot support it.
      tags: [diet]
      x-noura-milestone: M6
      x-noura-status: implemented
      parameters:
        - $ref: '#/components/parameters/DateQuery'
        - name: slot
          in: query
          required: false
          description: Request a specific slot instead of letting the engine pick the next unlogged one.
          schema: { $ref: '#/components/schemas/MealSlot' }
      responses:
        '200':
          description: Up to three grounded options (primary plus alternatives). Never logged automatically.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NextMealResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/recommendations/next-meal/actions:
    post:
      operationId: nextMealAction
      summary: Add, swap or dismiss a next-meal recommendation.
      description: |
        `add` creates a new plan slot from the recommended recipe when the date/slot has no planned
        meal yet (requires an active plan). `swap` replaces an existing planned slot with the
        recommended candidate, by calling the same `replacePlanMeal` domain logic the diet-plan swap
        screen uses (blueprint §9) — never a separate, duplicated code path. `dismiss` sticks for that
        date/slot (D-028) so a later GET honestly reports it was dismissed instead of recomputing the
        same suggestion. Safe to retry: identical `Idempotency-Key` + body replays the same result.
      tags: [diet]
      x-noura-milestone: M6
      x-noura-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NextMealActionRequest' }
      responses:
        '200':
          description: Result of the add/swap/dismiss action.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NextMealActionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/insights:
    get:
      operationId: getInsights
      summary: Seven-day nutrition patterns.
      description: |
        Daily and seven-day nutrition-pattern summaries from recorded meals (blueprint §10, §16 M6).
        A protein/fibre gap is identified only when the underlying data supports it: a day with no
        logs or incomplete nutrition coverage is excluded from the seven-day average and named in
        `excluded_days`/`coverage_uncertain` rather than silently counted as zero, and a gap is only
        ever reported once enough usable days exist to support the conclusion.
      tags: [insights]
      x-noura-milestone: M6
      x-noura-status: implemented
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, enum: ['7d'] }
      responses:
        '200':
          description: Seven-day evidence, coverage and explanations.
          content:
