      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/AccountExport' }
        meta: { $ref: '#/components/schemas/Meta' }
    DeleteAccountRequest:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm: { type: string, enum: [DELETE_MY_ACCOUNT] }
    DeletionAccepted:
      type: object
      additionalProperties: false
      required: [deletion_request_id, state]
      properties:
        deletion_request_id: { type: string, format: uuid }
        state: { type: string, enum: [requested, in_progress] }
    DeletionAcceptedResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/DeletionAccepted' }
        meta: { $ref: '#/components/schemas/Meta' }
