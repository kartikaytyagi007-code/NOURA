      additionalProperties: true
      required: [event]
      properties:
        api_version: { type: string }
        event:
          type: object
          additionalProperties: true
          required: [id, type]
          properties:
            id: { type: string, maxLength: 200 }
            type: { type: string, maxLength: 64 }
            app_user_id: { type: string }
            environment: { type: string }
    WebhookAck:
      type: object
      additionalProperties: false
      required: [received]
      properties:
        received: { type: boolean }
    WebhookAckResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/WebhookAck' }
        meta: { $ref: '#/components/schemas/Meta' }

    # ---------------------------------------------------------------- account
    ExportAccepted:
      type: object
      additionalProperties: false
      required: [export_id, job_id]
      properties:
        export_id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
    ExportAcceptedResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ExportAccepted' }
        meta: { $ref: '#/components/schemas/Meta' }
    AccountExport:
      type: object
      additionalProperties: false
      required: [id, state, download_url, expires_at]
